<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Únete como escritor — Gaceta ILB</title>
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    .login-contenedor {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .login-caja {
      background: #fff;
      border-radius: 4px;
      padding: 40px 48px;
      width: 100%;
      max-width: 400px;
    }
    .login-titulo {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--rojo);
      margin-bottom: 6px;
      letter-spacing: 0.05em;
      text-align: center;
    }
    .login-subtitulo {
      font-size: 0.82rem;
      color: #888;
      margin-bottom: 28px;
      text-align: center;
      line-height: 1.5;
    }
    .login-subtitulo .dominio {
      color: var(--rojo);
      font-weight: 800;
    }
    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    .campo label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #444;
    }
    .campo input {
      border: 1px solid #ddd;
      padding: 10px 12px;
      font-size: 0.9rem;
      font-family: inherit;
      border-radius: 2px;
      transition: border-color 0.2s;
      width: 100%;
      box-sizing: border-box;
    }
    .campo input:focus {
      outline: none;
      border-color: var(--rojo);
    }
    /* Wrapper para inputs con ojo */
    .campo-pass {
      position: relative;
    }
    .campo-pass input {
      padding-right: 42px;
    }
    .btn-ojo {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #aaa;
      padding: 4px;
      line-height: 0;
      transition: color 0.15s;
    }
    .btn-ojo:hover { color: #555; }
    .btn-enviar {
      width: 100%;
      background: var(--rojo);
      color: #fff;
      border: none;
      padding: 11px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      border-radius: 2px;
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    .btn-enviar:hover    { opacity: 0.85; }
    .btn-enviar:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-ok {
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 4px;
      padding: 16px;
      font-size: 0.88rem;
      text-align: center;
      display: none;
      margin-top: 8px;
      line-height: 1.5;
    }
    .form-error {
      color: var(--rojo);
      font-size: 0.82rem;
      margin-top: 14px;
      text-align: center;
      display: none;
    }
    .link-login {
      display: block;
      text-align: center;
      font-size: 0.78rem;
      color: #888;
      margin-top: 18px;
    }
    .link-login a { color: var(--rojo); text-decoration: underline; }
  </style>
</head>
<body>

  <header class="encabezado">
    <div class="encabezado-contenido">
      <a href="index.html" class="logo">GACETA<span> ILB</span></a>
    </div>
  </header>

  <main class="contenedor login-contenedor">
    <div class="login-caja">
      <p class="login-titulo">ÚNETE COMO ESCRITOR</p>
      <p class="login-subtitulo">
        Solo para correos <span class="dominio">@ilb.edu.mx</span><br>
        El equipo editorial revisará tu solicitud
      </p>

      <form id="form-registro">

        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" required maxlength="80" placeholder="Tu nombre">
        </div>

        <div class="campo">
          <label for="correo">Correo <span class="dominio">@ilb.edu.mx</span></label>
          <input type="email" id="correo" required autocomplete="email" placeholder="tu.nombre@ilb.edu.mx">
        </div>

        <div class="campo">
          <label for="correo2">Confirmar correo</label>
          <input type="email" id="correo2" required autocomplete="off" placeholder="Escribe el correo otra vez">
        </div>

        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <div class="campo-pass">
            <input type="password" id="contrasena" required minlength="6"
                   autocomplete="new-password" placeholder="Mínimo 6 caracteres">
            <button type="button" class="btn-ojo" id="ojo1" aria-label="Mostrar contraseña">
              <!-- ojo abierto -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="campo">
          <label for="contrasena2">Confirmar contraseña</label>
          <div class="campo-pass">
            <input type="password" id="contrasena2" required minlength="6"
                   autocomplete="new-password" placeholder="Escribe la contraseña otra vez">
            <button type="button" class="btn-ojo" id="ojo2" aria-label="Mostrar contraseña">
              <!-- ojo abierto -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-enviar" id="btn-enviar">Enviar solicitud</button>
      </form>

      <div class="form-ok" id="form-ok">
        ¡Solicitud enviada!<br>
        En cuanto el equipo editorial la apruebe podrás iniciar sesión.
      </div>
      <p class="form-error" id="form-error"></p>

      <p class="link-login">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
    </div>
  </main>

  <script type="module">
    import { auth, db }                                      from "./js/firebase.js";
    import { createUserWithEmailAndPassword, signOut }       from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import { doc, setDoc }                                   from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    const form     = document.getElementById("form-registro");
    const btnEnv   = document.getElementById("btn-enviar");
    const msgOk    = document.getElementById("form-ok");
    const msgError = document.getElementById("form-error");

    // --- OJO: toggle mostrar/ocultar contraseña ---
    const SVG_OJO_ABIERTO = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>`;

    const SVG_OJO_CERRADO = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
      <line x1="1" y1="1" x2="23" y2="23"/>
    </svg>`;

    function configurarOjo(btnId, inputId) {
      const btn   = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      btn.addEventListener("click", () => {
        const visible = input.type === "text";
        input.type        = visible ? "password" : "text";
        btn.innerHTML     = visible ? SVG_OJO_ABIERTO : SVG_OJO_CERRADO;
        btn.setAttribute("aria-label", visible ? "Mostrar contraseña" : "Ocultar contraseña");
      });
    }

    configurarOjo("ojo1", "contrasena");
    configurarOjo("ojo2", "contrasena2");

    // --- ENVIAR ---
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msgOk.style.display    = "none";
      msgError.style.display = "none";
      btnEnv.disabled        = true;

      const nombre      = document.getElementById("nombre").value.trim();
      const correo      = document.getElementById("correo").value.trim().toLowerCase();
      const correo2     = document.getElementById("correo2").value.trim().toLowerCase();
      const contrasena  = document.getElementById("contrasena").value;
      const contrasena2 = document.getElementById("contrasena2").value;

      if (!correo.endsWith("@ilb.edu.mx")) {
        mostrarError("Solo se aceptan correos @ilb.edu.mx.");
        return;
      }
      if (correo !== correo2) {
        mostrarError("Los correos no coinciden. Verifica que hayas escrito el mismo.");
        return;
      }
      if (contrasena !== contrasena2) {
        mostrarError("Las contraseñas no coinciden.");
        return;
      }

      try {
        const resultado = await createUserWithEmailAndPassword(auth, correo, contrasena);
        await setDoc(doc(db, "usuarios", resultado.user.uid), { nombre, correo, rol: "pendiente" });
        await signOut(auth);

        form.style.display  = "none";
        msgOk.style.display = "block";

      } catch (error) {
        const codigos = {
          "auth/email-already-in-use": "Ese correo ya está registrado.",
          "auth/invalid-email":        "El correo no es válido.",
          "auth/weak-password":        "La contraseña debe tener al menos 6 caracteres.",
        };
        mostrarError(codigos[error.code] ?? "Error al enviar la solicitud. Intenta de nuevo.");
        console.error(error);
      }
    });

    function mostrarError(texto) {
      msgError.textContent   = texto;
      msgError.style.display = "block";
      btnEnv.disabled        = false;
    }
  </script>

</body>
</html>
