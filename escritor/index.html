<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Escritor — Gaceta ILB</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/panel.css">
</head>
<body>

  <header class="encabezado">
    <div class="encabezado-contenido">
      <a href="../index.html" class="logo">GACETA<span> ILB</span></a>
      <div class="panel-usuario">
        <span id="nombre-usuario"></span>
        <button id="btn-salir" class="btn-salir">Salir</button>
      </div>
    </div>
  </header>

  <main class="contenedor">

    <section class="seccion">
      <h2 class="seccion-titulo" id="seccion-titulo">NUEVO ARTÍCULO</h2>

      <div id="aviso-revision" style="display:none; background:#fff8e1; border-left:3px solid #f57f17; padding:10px 14px; border-radius:2px; margin-bottom:16px; font-size:0.85rem; color:#555;">
        Tu artículo está pendiente de revisión. Puedes editarlo hasta que el editor lo apruebe.
      </div>

      <form id="form-articulo" class="formulario">

        <div class="campo">
          <label for="titulo">Título</label>
          <input type="text" id="titulo" maxlength="200" required placeholder="Título accesible para el lector">
        </div>

        <div class="campo">
          <label for="categoria">Categoría</label>
          <select id="categoria" required>
            <option value="">Selecciona una categoría</option>
            <option value="noticias">Noticias</option>
            <option value="avisos">Avisos</option>
            <option value="deportes">Deportes</option>
            <option value="logros">Logros</option>
            <option value="eventos">Eventos</option>
          </select>
        </div>

        <div class="campo">
          <label for="imagen">Imagen principal</label>
          <input type="file" id="imagen" accept="image/*">
          <p class="campo-ayuda">Máx 5 MB · JPG, PNG o WebP · Omite para conservar la imagen actual.</p>
          <div id="vista-previa-contenedor" style="display:none;">
            <img id="vista-previa" src="" alt="Vista previa" style="max-height:160px; margin-top:8px; display:block;">
          </div>
        </div>

        <div class="campo">
          <label for="contenido">Texto del artículo</label>
          <textarea id="contenido" rows="14" maxlength="50000" required
            placeholder="Escribe aquí el artículo..."></textarea>
        </div>

        <div class="form-acciones">
          <p class="form-estado" id="form-estado"></p>
          <button type="submit" class="btn-primario" id="btn-enviar">Enviar a revisión</button>
        </div>

      </form>
    </section>

  </main>

  <script type="module" src="../js/escritor.js"></script>
</body>
</html>
