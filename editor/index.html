<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Editor — Gaceta ILB</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/panel.css">
  <style>
    .art-categoria {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--rojo);
      margin-bottom: 10px;
    }
    .art-titulo {
      font-size: 1.6rem;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 12px;
    }
    .art-meta {
      font-size: 0.78rem;
      color: #888;
      margin-bottom: 24px;
    }
    .art-imagen-principal {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      margin-bottom: 28px;
    }
    .art-contenido {
      font-size: 1rem;
      line-height: 1.8;
      color: #222;
      white-space: pre-wrap;
    }
    .art-imagen-extra {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      margin: 28px 0;
    }
    .aviso-rechazo-vista {
      background: #fff8f8;
      border-left: 3px solid #b71c1c;
      padding: 12px 16px;
      border-radius: 2px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: #b71c1c;
    }
    .aviso-rechazo-vista strong { display: block; margin-bottom: 4px; }
    .aviso-rechazo-vista span   { color: #333; }
  </style>
</head>
<body>

  <header class="encabezado">
    <div class="encabezado-contenido">
      <a href="../index.html" class="logo">GACETA<span> ILB</span></a>
      <div class="panel-usuario">
        <span id="nombre-usuario"></span>
        <button id="btn-salir" class="btn-salir">Salir</button>
      </div>
    </div>
  </header>

  <main class="contenedor">

    <!-- PANEL LISTA — visible por defecto -->
    <div id="panel-lista">

      <section class="seccion">
        <h2 class="seccion-titulo">PENDIENTES DE REVISIÓN</h2>
        <div id="lista-pendientes" class="lista-articulos">
          <p class="lista-vacia">Cargando...</p>
        </div>
      </section>

      <section class="seccion">
        <h2 class="seccion-titulo">ACEPTADOS SIN PUBLICAR</h2>
        <div id="lista-aceptados" class="lista-articulos">
          <p class="lista-vacia">Cargando...</p>
        </div>
      </section>

      <section class="seccion">
        <h2 class="seccion-titulo">PUBLICADOS</h2>
        <div class="tabs" id="tabs-publicados" style="margin-bottom:12px;">
          <button class="tab activo" data-cat="noticias">NOTICIAS</button>
          <button class="tab" data-cat="avisos">AVISOS</button>
          <button class="tab" data-cat="deportes">DEPORTES</button>
          <button class="tab" data-cat="logros">LOGROS</button>
          <button class="tab" data-cat="eventos">EVENTOS</button>
        </div>
        <div id="lista-publicados" class="lista-articulos">
          <p class="lista-vacia">Cargando...</p>
        </div>
      </section>

      <section class="seccion">
        <h2 class="seccion-titulo">RECHAZADOS</h2>
        <div id="lista-rechazados" class="lista-articulos">
          <p class="lista-vacia">Cargando...</p>
        </div>
      </section>

    </div>

    <!-- PANEL VISTA — oculto hasta seleccionar artículo -->
    <div id="panel-vista" style="display:none;">

      <div class="detalle-acciones" style="margin-bottom:16px;">
        <button class="btn-secundario" id="btn-volver">← Volver</button>
        <button class="btn-primario"   id="btn-aceptar"  style="display:none;">Aceptar</button>
        <button class="btn-primario"   id="btn-publicar" style="display:none;">Publicar ahora</button>
        <button class="btn-secundario" id="btn-rechazar" style="display:none;">Rechazar…</button>
        <button class="btn-destacado"  id="btn-destacar" style="display:none;">☆ Destacar</button>
        <p class="form-estado" id="vista-estado"></p>
      </div>

      <!-- Zona de rechazo (toggle) -->
      <div id="zona-rechazo" class="zona-rechazo" style="display:none;">
        <p style="font-size:0.82rem; font-weight:700; color:#444; margin-bottom:0;">MOTIVO DEL RECHAZO</p>
        <textarea id="motivo-rechazo" rows="3" placeholder="Explica al escritor qué debe corregir o mejorar..."></textarea>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button class="btn-primario btn-peligro" id="btn-confirmar-rechazo">Confirmar rechazo</button>
          <button class="btn-secundario"            id="btn-cancelar-rechazo">Cancelar</button>
        </div>
      </div>

      <div class="detalle-contenedor" id="vista-articulo"></div>

    </div>

  </main>

  <script type="module" src="../js/editor.js"></script>
</body>
</html>
