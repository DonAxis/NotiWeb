<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Editor — Gaceta ILB</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/panel.css">
  <style>
    /* Render de artículo igual a articulo.html */
    .art-categoria {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--rojo);
      margin-bottom: 10px;
    }
    .art-titulo {
      font-size: 1.6rem;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 12px;
    }
    .art-meta {
      font-size: 0.78rem;
      color: #888;
      margin-bottom: 24px;
    }
    .art-imagen-principal {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      margin-bottom: 28px;
    }
    .art-contenido {
      font-size: 1rem;
      line-height: 1.8;
      color: #222;
      white-space: pre-wrap;
    }
    .art-imagen-extra {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      margin: 28px 0;
    }
  </style>
</head>
<body>

  <header class="encabezado">
    <div class="encabezado-contenido">
      <a href="../index.html" class="logo">GACETA<span> ILB</span></a>
      <div class="panel-usuario">
        <span id="nombre-usuario"></span>
        <button id="btn-salir" class="btn-salir">Salir</button>
      </div>
    </div>
  </header>

  <main class="contenedor">

    <!-- PANEL LISTA — visible por defecto -->
    <div id="panel-lista">

      <section class="seccion">
        <h2 class="seccion-titulo">PENDIENTES</h2>
        <div id="lista-pendientes" class="lista-articulos">
          <p class="lista-vacia">Cargando...</p>
        </div>
      </section>

      <section class="seccion">
        <h2 class="seccion-titulo">PUBLICADOS</h2>
        <div class="tabs" id="tabs-publicados" style="margin-bottom:12px;">
          <button class="tab activo" data-cat="noticias">NOTICIAS</button>
          <button class="tab" data-cat="avisos">AVISOS</button>
          <button class="tab" data-cat="deportes">DEPORTES</button>
          <button class="tab" data-cat="logros">LOGROS</button>
          <button class="tab" data-cat="eventos">EVENTOS</button>
        </div>
        <div id="lista-publicados" class="lista-articulos">
          <p class="lista-vacia">Cargando...</p>
        </div>
      </section>

    </div>

    <!-- PANEL VISTA — oculto hasta seleccionar artículo -->
    <div id="panel-vista" style="display:none;">

      <div class="detalle-acciones" style="margin-bottom:16px;">
        <button class="btn-secundario" id="btn-volver">← Volver</button>
        <button class="btn-primario"  id="btn-aprobar"  style="display:none;">Aprobar</button>
        <button class="btn-destacado" id="btn-destacar" style="display:none;">☆ Destacar</button>
        <p class="form-estado" id="vista-estado"></p>
      </div>

      <div class="detalle-contenedor" id="vista-articulo"></div>

    </div>

  </main>

  <script type="module" src="../js/editor.js"></script>
</body>
</html>
