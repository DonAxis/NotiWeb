<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artículo — Gaceta ILB</title>
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    .articulo-pagina {
      max-width: 720px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .art-categoria {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--rojo);
      margin-bottom: 10px;
    }
    .art-titulo {
      font-size: 1.8rem;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 12px;
    }
    .art-meta {
      font-size: 0.78rem;
      color: #888;
      margin-bottom: 24px;
    }
    .art-imagen-principal {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      margin-bottom: 28px;
    }
    .art-contenido {
      font-size: 1rem;
      line-height: 1.8;
      color: #222;
      white-space: pre-wrap;
      text-align: justify;
    }
    .art-imagen-extra {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      margin: 28px 0;
    }
    .art-fuentes {
      margin-top: 36px;
      padding-top: 16px;
      border-top: 1px solid var(--gris-borde);
      font-size: 0.82rem;
      color: #777;
    }
    .art-fuentes strong {
      display: block;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 0.75rem;
    }
    .art-fuentes a {
      color: var(--rojo);
      display: block;
      word-break: break-all;
      margin-bottom: 4px;
    }
    .art-error {
      text-align: center;
      padding: 60px 16px;
      color: #888;
    }
  </style>
</head>
<body>

  <header class="encabezado">
    <div class="encabezado-contenido">
      <a href="index.html" class="logo">GACETA<span> ILB</span></a>
      <nav class="nav-principal">
        <a href="index.html">← Volver</a>
      </nav>
    </div>
  </header>

  <main id="contenido-articulo" class="articulo-pagina">
    <p style="color:#888; text-align:center; padding:60px 0;">Cargando...</p>
  </main>

  <footer class="pie">
    <p>© 2026 Gaceta ILB — Instituto ILB</p>
  </footer>

  <script type="module">
    import { db }          from "./js/firebase.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
    import { escaparHTML, urlSegura, renderContenido, nombreCategoria } from "./js/utilidades.js";

    const params     = new URLSearchParams(window.location.search);
    const id         = params.get("id");
    const contenedor = document.getElementById("contenido-articulo");

    const mostrarNoDisponible = () => {
      contenedor.innerHTML = `<p class="art-error">Este artículo no está disponible.</p>`;
    };

    async function cargarArticulo() {
      // Las reglas niegan la lectura de artículos inexistentes o no publicados:
      // getDoc lanza permission-denied en vez de devolver vacío.
      let snap;
      try {
        snap = await getDoc(doc(db, "articulos", id));
      } catch (error) {
        console.error(error);
        mostrarNoDisponible();
        return;
      }

      if (!snap.exists() || snap.data().estado !== "publicado") {
        mostrarNoDisponible();
        return;
      }

      const a     = snap.data();
      const fecha = a.fechaPublicacion?.toDate().toLocaleDateString("es-MX", {
        year: "numeric", month: "long", day: "numeric"
      }) ?? "";

      // autorNombre se guarda en el artículo porque el público no puede leer /usuarios
      const autorTexto = a.autorNombre ? ` · Escrito por ${escaparHTML(a.autorNombre)}` : "";

      document.title = `${a.titulo} — Gaceta ILB`;

      let fuentesHTML = "";
      if (a.fuente) {
        const links = a.fuente.split("\n")
          .map(urlSegura).filter(Boolean)
          .map(url => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`)
          .join("");
        if (links) fuentesHTML = `<div class="art-fuentes"><strong>Fuentes</strong>${links}</div>`;
      }

      const img2 = urlSegura(a.imagen2URL) ? `<img src="${urlSegura(a.imagen2URL)}" alt="" class="art-imagen-extra">` : "";
      const img3 = urlSegura(a.imagen3URL) ? `<img src="${urlSegura(a.imagen3URL)}" alt="" class="art-imagen-extra">` : "";
      const portada = urlSegura(a.imagenURL)
        ? `<img src="${urlSegura(a.imagenURL)}" alt="${escaparHTML(a.titulo)}" class="art-imagen-principal">` : "";

      const parrafos = (a.contenido || "").split("\n\n");
      const mitad    = Math.ceil(parrafos.length / 2);
      const parte1   = renderContenido(parrafos.slice(0, mitad).join("\n\n"));
      const parte2   = renderContenido(parrafos.slice(mitad).join("\n\n"));

      contenedor.innerHTML = `
        <p class="art-categoria">${escaparHTML(nombreCategoria(a.categoria))}</p>
        <h1 class="art-titulo">${escaparHTML(a.titulo)}</h1>
        <p class="art-meta">${fecha}${autorTexto}</p>
        ${portada}
        <div class="art-contenido">${parte1}</div>
        ${img2}
        <div class="art-contenido">${parte2}</div>
        ${img3}
        ${fuentesHTML}`;
    }

    if (!id) {
      contenedor.innerHTML = `<p class="art-error">Artículo no encontrado.</p>`;
    } else {
      cargarArticulo();
    }
  </script>

</body>
</html>
