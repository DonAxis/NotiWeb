<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin — Gaceta ILB</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/panel.css">
  <style>
    .tabla-usuarios {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    .tabla-usuarios th {
      text-align: left;
      padding: 8px 12px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 2px solid var(--gris-borde);
      color: #555;
    }
    .tabla-usuarios td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--gris-borde);
      vertical-align: middle;
    }
    .tabla-usuarios tr:last-child td { border-bottom: none; }
    .badge-rol {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 2px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: capitalize;
    }
    .badge-escritor  { background: #e3f2fd; color: #1565c0; }
    .badge-editor    { background: #e8f5e9; color: #2e7d32; }
    .badge-admin     { background: #fce4ec; color: #b71c1c; }
    .badge-pendiente { background: #fff8e1; color: #e65100; }
    .btn-aprobar {
      background: none;
      border: 1px solid #c8e6c9;
      padding: 4px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      border-radius: 2px;
      color: #2e7d32;
      font-weight: 700;
      margin-right: 6px;
      transition: background 0.15s;
    }
    .btn-aprobar:hover { background: #e8f5e9; }
    .btn-eliminar {
      background: none;
      border: 1px solid #ddd;
      padding: 4px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      border-radius: 2px;
      color: #c62828;
      transition: background 0.15s;
    }
    .btn-eliminar:hover { background: #fce4ec; }
    .sel-rol {
      border: 1px solid #ddd;
      padding: 4px 6px;
      font-size: 0.75rem;
      font-family: inherit;
      border-radius: 2px;
      color: #444;
      margin-right: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header class="encabezado">
    <div class="encabezado-contenido">
      <a href="index.html" class="logo">GACETA<span> ILB</span></a>
      <div class="panel-usuario">
        <span id="nombre-usuario"></span>
        <button id="btn-salir" class="btn-salir">Salir</button>
      </div>
    </div>
  </header>

  <main class="contenedor">

    <!-- Solicitudes pendientes de aprobación -->
    <section class="seccion">
      <h2 class="seccion-titulo">SOLICITUDES PENDIENTES</h2>
      <div style="background:#fff; border-radius:4px; overflow:auto;">
        <table class="tabla-usuarios">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Correo</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="pendientes-body">
            <tr><td colspan="3" style="color:#888; padding:16px;">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Lista de usuarios -->
    <section class="seccion">
      <h2 class="seccion-titulo">USUARIOS REGISTRADOS</h2>
      <div style="background:#fff; border-radius:4px; overflow:auto;">
        <table class="tabla-usuarios">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Rol</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tabla-body">
            <tr><td colspan="4" style="color:#888; padding:16px;">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
